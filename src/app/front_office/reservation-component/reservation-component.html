<h2 class="text-center my-3">Mes Réservations</h2>

<table class="table table-bordered table-striped table-hover w-75 mx-auto">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Date de visite</th>
      <th>Nombre de billets</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    @for (r of reservations; track r.id) {
      <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.dateVisite | date:'mediumDate' }}</td>
        <td>{{ r.nombreBillets }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="cancel(r.id)">
            Annuler
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="text-center text-muted">
          Aucune réservation trouvée 
        </td>
      </tr>
    }
  </tbody>
</table>
