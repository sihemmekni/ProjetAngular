<div class="container mt-5">
  <h2 class="mb-4">Nos Patrimoines</h2>

  <div class="row">
    @for (p of patrimoines; track p.id) {
      <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
          <img [src]="p.imageUrl" class="card-img-top" alt="{{ p.nom }}">
          <div class="card-body">
            <h5 class="card-title">{{ p.nom }}</h5>
            <p class="card-text">{{ p.description | slice:0:100 }}...</p>
            <a [routerLink]="['/patrimoine', p.id]" class="btn btn-primary btn-sm">Voir détails</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
