<div class="row">
  <div class="col-md-4" *ngFor="let p of results; trackBy: trackById">
    <div class="card mb-4 shadow-sm">
      <img [src]="p.imageUrl" class="card-img-top" alt="{{ p.nom }}">
      <div class="card-body">
        <h5 class="card-title">{{ p.nom }}</h5>
        <p class="card-text">{{ p.description | slice:0:50 }}...</p>
        <p><strong>Localisation:</strong> {{ p.localisation }}</p>
        <a [routerLink]="['/patrimoine', p.id]" class="btn btn-primary btn-sm">
          Voir détails
        </a>
      </div>
    </div>
  </div>
</div>


<p *ngIf="results.length === 0">Aucun patrimoine trouvé.</p>
