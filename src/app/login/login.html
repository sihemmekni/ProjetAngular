<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow-sm p-4">
    <h3 class="text-center mb-4">Connexion</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <input type="text" formControlName="username" class="form-control" placeholder="Nom d'utilisateur">
        @if(loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
          <div class="text-danger mt-1">
            Le nom d'utilisateur est requis.
          </div>
        }
      </div>

      <div class="mb-3">
        <input type="password" formControlName="password" class="form-control" placeholder="Mot de passe">
        @if(loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <div class="text-danger mt-1">
            Le mot de passe est requis.
          </div>
        }
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loginForm.invalid">Se connecter</button>

    </form>

    <div class="text-center mt-3">
      <span>Pas encore de compte ? </span>
      <a routerLink="/register">S'inscrire</a>
    </div>
  </div>
</div>
